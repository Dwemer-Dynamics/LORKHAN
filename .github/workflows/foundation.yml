name: foundation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: UTC
  LANG: C
  LC_ALL: C
  SOURCE_DATE_EPOCH: '1784442566'

jobs:
  python-evidence:
    name: Python foundation and evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Validate evidence documents
        run: python3 scripts/evidence/validate.py
      - name: Run foundation unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate CI scripts statically
        run: scripts/test/validate-ci.sh
      - name: Run Lua tests when available
        run: scripts/test/lua-unix.sh
      - name: Record scope honestly
        if: always()
        run: |
          printf '%s\n' 'This job proves only the commands shown above.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'A skipped Lua discovery is not Lua test proof; native builds and packages are covered by separate readiness lanes.' >> "$GITHUB_STEP_SUMMARY"

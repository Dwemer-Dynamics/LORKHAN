name: foundation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: UTC
  LANG: C
  LC_ALL: C
  SOURCE_DATE_EPOCH: '1784442566'

jobs:
  python-evidence:
    name: Python foundation and evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Validate evidence documents
        run: python3 scripts/evidence/validate.py
      - name: Run foundation unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate CI scripts statically
        run: scripts/test/validate-ci.sh
      - name: Run loopback fake-server contract tests
        run: python3 -m unittest discover -s almsivi/tests -v
      - name: Run Lua structural checks
        run: python3 almsivi/tests/run.py
      - name: Run Lua runtime tests when available
        env:
          ALMSIVI_LUA_TEST_ROOT: ${{ github.workspace }}/almsivi/files/scripts/ALMSIVI/tests
        run: scripts/test/lua-unix.sh
      - name: Record scope honestly
        if: always()
        run: |
          printf '%s\n' 'This job proves only the commands actually executed above.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'A skipped Lua runtime is not Lua runtime proof; standalone native builds run in the separate native workflow.' >> "$GITHUB_STEP_SUMMARY"

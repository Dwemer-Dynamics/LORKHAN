name: lua-runtime

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Ubuntu Lua runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lua runtime
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run required Lua runtime tests
        env:
          LORKHAN_REQUIRE_LUA_TESTS: '1'
        run: scripts/test/lua-unix.sh

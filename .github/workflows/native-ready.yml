name: native-ready

on:
  workflow_dispatch:
    inputs:
      require_native_target:
        description: Fail if the declared native target is absent
        required: false
        default: false
        type: boolean
      native_target:
        description: Declared required CMake target
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C
  LC_ALL: C
  SOURCE_DATE_EPOCH: '1784442566'

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.mode }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [pure, sanitizer]
        config: [Debug, RelWithDebInfo, Release]
        exclude:
          - mode: sanitizer
            config: RelWithDebInfo
          - mode: sanitizer
            config: Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Detect native target
        id: detect
        shell: bash
        env:
          TARGET: ${{ inputs.native_target }}
          REQUIRE: ${{ inputs.require_native_target }}
        run: |
          set -eu
          if [ -n "$TARGET" ] && grep -R -F "add_custom_target($TARGET" CMakeLists.txt cmake 2>/dev/null; then echo ready=true >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE" = true ]; then echo "Declared required native target missing: $TARGET" >&2; exit 3
          else echo ready=false >> "$GITHUB_OUTPUT"; echo 'Native target absent; readiness lane records no build proof.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Bootstrap exact source from verified offline cache
        if: steps.detect.outputs.ready == 'true'
        run: |
          test -d .cache/almsivi || { echo 'No generated cache is committed or provided; offline reconstruction not run.' >&2; exit 3; }
          ALMSIVI_CACHE_DIR="$PWD/.cache/almsivi" ALMSIVI_SOURCE_DIR="$RUNNER_TEMP/openmw" ALMSIVI_RUN_MANIFEST="$RUNNER_TEMP/bootstrap.json" scripts/bootstrap/unix.sh
      - name: Build declared target
        if: steps.detect.outputs.ready == 'true'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = sanitizer ]; then
            CFLAGS=-fsanitize=address,undefined CXXFLAGS=-fsanitize=address,undefined LDFLAGS=-fsanitize=address,undefined scripts/build/unix.sh --state control --source "$RUNNER_TEMP/openmw" --build "$RUNNER_TEMP/build" --install "$RUNNER_TEMP/install" --output "$RUNNER_TEMP/output" --compiler '${{ matrix.compiler }}' --config '${{ matrix.config }}' --target '${{ inputs.native_target }}'
          else
            scripts/build/unix.sh --state control --source "$RUNNER_TEMP/openmw" --build "$RUNNER_TEMP/build" --install "$RUNNER_TEMP/install" --output "$RUNNER_TEMP/output" --compiler '${{ matrix.compiler }}' --config '${{ matrix.config }}' --target '${{ inputs.native_target }}'
          fi

  macos-arm64:
    name: macOS arm64 readiness
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify architecture and readiness contract
        run: |
          test "$(uname -m)" = arm64
          scripts/test/validate-ci.sh
          echo 'Native source cache/target is not declared required; no macOS native build proof claimed.' >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    name: Windows x64 ${{ matrix.state }} ${{ matrix.config }} readiness
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        state: [control, patched]
        config: [Debug, RelWithDebInfo, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Parse PowerShell wrappers
        shell: pwsh
        run: |
          $files = 'scripts/build/windows.ps1','scripts/test/lua-windows.ps1'
          foreach ($file in $files) { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null; if ($errors.Count) { $errors; exit 1 } }
          "Wrapper syntax validated. Native source cache/patch application target is not declared required; no Windows native build proof claimed." >> $env:GITHUB_STEP_SUMMARY

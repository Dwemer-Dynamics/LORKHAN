name: windows-native

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2022:
    name: Windows 2022 MSVC x64 Release
    runs-on: windows-2022
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record hosted MSVC toolchain identity
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1 | Tee-Object -FilePath toolchain-identity.txt
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion | Tee-Object -FilePath toolchain-identity.txt -Append
          "runner_image=$env:ImageOS`nrunner_image_version=$env:ImageVersion" | Tee-Object -FilePath toolchain-identity.txt -Append
          Get-Content toolchain-identity.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Hosted runner tools are recorded but not immutable release-toolchain pins.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Validate PowerShell entrypoints
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Configure standalone native core
        shell: pwsh
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64
      - name: Build standalone native core and tests
        shell: pwsh
        run: cmake --build build/native --target almsivi_core almsivi_native_tests --config Release
      - name: Test standalone native core
        shell: pwsh
        run: ctest --test-dir build/native --build-config Release --output-on-failure -R '^almsivi-native$'

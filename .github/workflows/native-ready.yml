name: standalone-native

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: UTC
  LANG: C
  LC_ALL: C
  SOURCE_DATE_EPOCH: '1784442566'

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, RelWithDebInfo, Release]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record hosted toolchain identity
        shell: bash
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          set -eu
          { cmake --version | sed -n '1p'; ninja --version; "$CC" --version | sed -n '1p'; "$CXX" --version | sed -n '1p'; printf 'runner_image=%s\nrunner_image_version=%s\n' "$ImageOS" "$ImageVersion"; } | tee toolchain-identity.txt
          cat toolchain-identity.txt >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Hosted runner tools are recorded but not immutable release-toolchain pins.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure standalone native core
        shell: bash
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.config }}"
      - name: Build standalone native core and tests
        run: cmake --build build/native --target almsivi_core almsivi_native_tests --config '${{ matrix.config }}'
      - name: Test standalone native core
        run: ctest --test-dir build/native --build-config '${{ matrix.config }}' --output-on-failure -R '^almsivi-native$'

  linux-beast:
    name: Linux Beast compile and tests (definition only)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Boost.System build dependency
        run: sudo apt-get update && sudo apt-get install --yes libboost-system-dev
      - name: Configure Beast-enabled native core
        run: cmake -S . -B build/beast -G Ninja -DCMAKE_BUILD_TYPE=Debug -DALMSIVI_WITH_BOOST_BEAST=ON
      - name: Compile Beast transport and tests
        run: cmake --build build/beast --target almsivi_core almsivi_native_tests almsivi_beast_transport_tests
      - name: Run Beast and native tests
        run: ctest --test-dir build/beast --output-on-failure -R '^(almsivi-native|almsivi-beast-transport)$'
      - name: Record definition scope honestly
        if: always()
        run: printf '%s\n' 'The checked-in workflow is a hosted Beast build/test definition, not an execution claim.' >> "$GITHUB_STEP_SUMMARY"

  linux-sanitizers:
    name: Linux Clang Debug ASan UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record hosted sanitizer toolchain identity
        shell: bash
        run: |
          set -eu
          { cmake --version | sed -n '1p'; ninja --version; clang --version | sed -n '1p'; clang++ --version | sed -n '1p'; printf 'runner_image=%s\nrunner_image_version=%s\n' "$ImageOS" "$ImageVersion"; } | tee toolchain-identity.txt
          cat toolchain-identity.txt >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Hosted runner tools are recorded but not immutable release-toolchain pins.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure sanitizer lane
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/native-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer tests
        run: cmake --build build/native-sanitize --target almsivi_native_tests
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/native-sanitize --output-on-failure -R '^almsivi-native$'

  macos-arm64:
    name: macOS arm64 Clang warning-clean
    runs-on: macos-14
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify arm64 runner and record hosted toolchain identity
        run: |
          set -eu
          test "$(uname -m)" = arm64
          { cmake --version | sed -n '1p'; ninja --version; clang --version | sed -n '1p'; clang++ --version | sed -n '1p'; printf 'runner_image=%s\nrunner_image_version=%s\n' "$ImageOS" "$ImageVersion"; } | tee toolchain-identity.txt
          cat toolchain-identity.txt >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Hosted runner tools are recorded but not immutable release-toolchain pins.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure standalone native core
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build warning-clean standalone native core and tests
        run: cmake --build build/native --target almsivi_core almsivi_native_tests
      - name: Test standalone native core
        run: ctest --test-dir build/native --output-on-failure -R '^almsivi-native$'

  windows-2022:
    name: Windows 2022 MSVC ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo, Release]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record hosted MSVC toolchain identity
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1 | Tee-Object -FilePath toolchain-identity.txt
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion | Tee-Object -FilePath toolchain-identity.txt -Append
          "runner_image=$env:ImageOS`nrunner_image_version=$env:ImageVersion" | Tee-Object -FilePath toolchain-identity.txt -Append
          Get-Content toolchain-identity.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Hosted runner tools are recorded but not immutable release-toolchain pins.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Configure standalone native core
        shell: pwsh
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64
      - name: Build standalone native core and tests
        shell: pwsh
        run: cmake --build build/native --target almsivi_core almsivi_native_tests --config '${{ matrix.config }}'
      - name: Test standalone native core
        shell: pwsh
        run: ctest --test-dir build/native --build-config '${{ matrix.config }}' --output-on-failure -R '^almsivi-native$'

SettingsPage_name: ALMSIVI
SettingsPage_description: Configure ALMSIVI controls for conversations, voice input, and emergency stopping.
ControlsGroup_name: Controls
ControlsGroup_description: Click a binding to clear it, then press a keyboard, mouse, or controller button to assign it.
Talk_name: Talk with ALMSIVI
Talk_description: Open the ALMSIVI conversation window and target the actor under the crosshair.
Halt_name: Emergency stop ALMSIVI
Halt_description: Cancel current ALMSIVI work and disable the session until the next load.
PushToTalk_name: Push to talk with ALMSIVI
PushToTalk_description: Hold to record your microphone, transcribe it through ALMSIVIserver, and send the transcript to the selected NPC group.
OpenMic_name: Toggle ALMSIVI open microphone
OpenMic_description: Opt in to voice-activated recording for the selected NPC group; toggle again to stop immediately.

BehaviorGroup_description: Combat interruption and microphone settings.
ActionsEnabled_name: Enable AI actions
ActionsEnabled_description: Allow NPCs to perform AI actions.
AutoGreeting_name: Enable automatic greetings
AutoGreeting_description: Let nearby NPCs greet you.
Rechat_name: Enable conversation continuation
Rechat_description: Let NPCs continue recent conversations.
RechatDelay_name: Rechat quiet time
RechatDelay_description: Seconds before an NPC may speak again.

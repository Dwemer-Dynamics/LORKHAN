SettingsPage_name: LORKHAN
SettingsPage_description: Configure conversation controls, automatic NPC activation, voice, AI actions, and display options.
HotkeysGroup_name: Hotkeys
HotkeysGroup_description: Select a binding, clear it, then press a keyboard, mouse, or controller button to assign it.
ControlsGroup_name: Hotkeys
ControlsGroup_description: Focused gameplay controls. Click a binding to clear it, then press a keyboard, mouse, or controller button to assign it.
Talk_name: Interact
Talk_description: Target the actor under the crosshair and open the Interact menu; type and press Enter to send, or select dialogue mode, LLM model, dynamic profiles, context history, status HUD, or diagnostics.
StopDialogue_name: Stop Dialogue
StopDialogue_description: Cancel the active response and speech without disabling LORKHAN or stopping unrelated NPC behavior.
Halt_name: Halt All Activity
Halt_description: Recoverably cancel current dialogue, generated speech, microphone capture, and LORKHAN-owned actor actions.
PushToTalk_name: Voice Chat
PushToTalk_description: Hold to record your microphone, transcribe it through the LORKHAN server, and send the transcript to the selected NPC group.
OpenMic_name: Open Microphone
OpenMic_description: Opt in to voice-activated recording for the selected NPC group; toggle again to stop immediately.
OpenMicMute_name: Mute Open Microphone
OpenMicMute_description: Temporarily pause or resume voice-activated recording without turning open microphone mode off.
ManualActivate_name: Activate AI Agents
ManualActivate_description: Add or remove the aimed NPC as a pinned agent, or pin a bounded nearby group when no NPC is aimed at.
ActionsMenu_name: Open LORKHAN actions menu
ActionsMenu_description: Open actor-scoped roleplay and safety actions for the current NPC.
ActorTools_name: Targeted NPC Tools
ActorTools_description: Open the compact menu for the aimed NPC, including activation, profiles, conversation controls, and actor actions.
MasterMenu_name: Open LORKHAN master menu
MasterMenu_description: Legacy binding retained for compatibility; opens Targeted NPC Tools in the focused interface.
ToggleMode_name: Cycle LORKHAN dialogue mode
ToggleMode_description: Open the Standard, Whisper, Close, and Shout conversation routing selector.
ModeMenu_name: Toggle Modes
ModeMenu_description: Legacy binding retained for compatibility; the mode selector is in the Interact menu.
ModelMenu_name: Toggle LLM Model
ModelMenu_description: Legacy binding retained for compatibility; the server-owned LLM model selector is in the Interact menu.
ProfileMenu_name: Dynamic Profile Menu
ProfileMenu_description: Legacy binding retained for compatibility; targeted NPC, nearby AI NPC, and narrator profile management are in the Interact menu.
StatusHud_name: Status HUD
StatusHud_description: Legacy binding retained for compatibility; the compact target, mode, voice, and server status display is toggled from the Interact menu.
History_name: Context History
History_description: Legacy binding retained for compatibility; the recent LORKHAN conversation history panel is in the Interact menu.
Diagnostics_name: Diagnostics
Diagnostics_description: Legacy binding retained for compatibility; the safe in-game LORKHAN status and diagnostics panel is in the Interact menu.
AutoActivateGroup_name: Auto Activate
AutoActivateGroup_description: Automatically manage nearby eligible NPCs using bounded active-cell scans.
AutoActivateEnabled_name: Enable Auto Activate
AutoActivateEnabled_description: Automatically add eligible nearby NPCs as LORKHAN agents.
InteriorDistance_name: Interior Auto Activate Distance (units)
InteriorDistance_description: Maximum automatic activation distance inside buildings and interior cells, measured in OpenMW units.
ExteriorDistance_name: Exterior Auto Activate Distance (units)
ExteriorDistance_description: Maximum automatic activation distance in exterior cells, measured in OpenMW units.
InteriorHearingDistance_name: Interior Spatial Hearing Distance (units)
InteriorHearingDistance_description: Nearby managed actors inside this distance may join spatial conversation in interior cells. Measured in OpenMW units.
ExteriorHearingDistance_name: Exterior Spatial Hearing Distance (units)
ExteriorHearingDistance_description: Nearby managed actors inside this distance may join spatial conversation in exterior cells. Measured in OpenMW units.
AddHostile_name: Include Hostile NPCs
AddHostile_description: Allow hostile NPCs to be automatically managed by LORKHAN.
AddCreatures_name: Include Creatures
AddCreatures_description: Allow creatures as well as NPCs to be automatically managed by LORKHAN.
BehaviorGroup_name: Conversation & Microphone
BehaviorGroup_description: Configure combat interruption, microphone detection, and the recording device.
ActionsEnabled_name: Enable AI actions
ActionsEnabled_description: Allow negotiated LORKHAN action intents to execute in OpenMW.
AutoGreeting_name: Enable automatic greetings
AutoGreeting_description: Allow eligible managed NPCs to greet the player subject to distance and cooldown rules.
Rechat_name: Enable conversation continuation
Rechat_description: Allow a recent conversation to continue after a bounded quiet period.
RechatDelay_name: Rechat quiet time
RechatDelay_description: Seconds after completed dialogue before the selected NPC may continue the conversation.
RechatMaxDepth_name: Maximum rechat turns
RechatMaxDepth_description: Maximum consecutive autonomous continuation turns before LORKHAN waits for new player input.
Boredom_name: Enable idle conversation
Boredom_description: Allow occasional context-aware conversation when no active turn is running.
BoredomDelay_name: Idle conversation quiet time
BoredomDelay_description: Seconds without active dialogue before a managed NPC may start an idle conversation.
AvoidAutonomyInMenus_name: Pause autonomous dialogue in menus
AvoidAutonomyInMenus_description: Reset the idle timer while an OpenMW menu or interface is open.
AvoidAutonomyInCombat_name: Pause autonomous dialogue in combat
AvoidAutonomyInCombat_description: Reset the idle timer while a managed nearby actor is fighting the player.
AvoidAutonomyWhenSneaking_name: Pause autonomous dialogue while sneaking
AvoidAutonomyWhenSneaking_description: Reset the idle timer while the player is sneaking.
CancelDialogueOnCombat_name: Stop Dialogue When Combat Starts
CancelDialogueOnCombat_description: Cancel active LORKHAN dialogue and voice capture when a managed actor begins fighting the player.
CombatBarks_name: Enable combat barks
CombatBarks_description: Allow managed hostile actors to make bounded contextual combat remarks when no other LORKHAN work is active.
CombatBarkPeriod_name: Combat bark interval
CombatBarkPeriod_description: Minimum seconds between LORKHAN combat remarks while a managed actor remains hostile to the player.
OpenMicSensitivity_name: Open Microphone Sensitivity
OpenMicSensitivity_description: RMS level required to detect speech. Higher values require louder speech.
OpenMicEndDelay_name: Open Microphone End Delay (ms)
OpenMicEndDelay_description: Milliseconds of silence after speech before LORKHAN submits the recording.
RecordingDevice_name: Recording Device ID
RecordingDevice_description: WinMM recording device used by LORKHAN. Use -1 for the Windows default; Diagnostics lists every available ID and name. Restart capture after changing it.
CurrentRecordingDevice_name: Current Recording Device
CurrentRecordingDevice_description: Read-only name resolved for the configured recording device ID when LORKHAN loaded.
SoundGroup_name: Sound
SoundGroup_description: Configure LORKHAN-generated speech playback without changing other OpenMW audio.
AgentsGroup_name: AI Agents
AgentsGroup_description: Configure capabilities available to managed LORKHAN actors.
ToolsGroup_name: Display
ToolsGroup_description: Configure the optional status display and conversation history size.
PresentationGroup_name: Tools / Advanced
PresentationGroup_description: Optional status and retained transcript controls.
ShowStatusHud_name: Show Status HUD
ShowStatusHud_description: Keep a compact LORKHAN status strip visible. Off by default; important updates still appear briefly.
TranscriptRows_name: Conversation History Rows
TranscriptRows_description: Maximum recent dialogue rows retained in the in-game conversation panel.
TtsVolumeBoost_name: AI Voice Volume Boost (x)
TtsVolumeBoost_description: Multiply only LORKHAN-generated speech volume. 1x uses normal OpenMW voice volume; 4x is four times louder.
MenuDialogueTts_name: Menu Dialogue TTS
MenuDialogueTts_description: Speak regular Morrowind dialogue and menu responses aloud. Off leaves vanilla topic text silent.
